name: Sync PR branch with upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RockJesus/default
          ref: Add-RockJesus/ha-fordpass-cn
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0
      - name: Merge upstream master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/hacs/default.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "已是最新，无需同步"
          else
            if git merge upstream/master --no-edit 2>/tmp/merge_err; then
              git push origin Add-RockJesus/ha-fordpass-cn
              echo "已合并上游 master 并推送"
            else
              git merge --abort
              echo "合并冲突，已回滚保留现状（需人工处理）"
              cat /tmp/merge_err
              exit 1
            fi
          fi
